name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and argv tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run offline tests
        run: bash tests/run.sh

  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          grep "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Validate action.yml schema
        run: |
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet check-jsonschema
          /tmp/schema-venv/bin/check-jsonschema \
            --schemafile https://json.schemastore.org/github-action.json \
            action.yml
          /tmp/schema-venv/bin/check-jsonschema \
            --builtin-schema github-workflows \
            .github/workflows/ci.yml \
            example/.github/workflows/deploy.yml

      - name: Run local lint script
        run: bash tests/lint.sh
