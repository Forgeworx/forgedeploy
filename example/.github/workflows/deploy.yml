# Copy this file into an EXISTING Forge app repo as
# .github/workflows/deploy.yml — not into the ForgeDeploy action repo.
# Default layout: manifest.yml + package.json at that repo's root.
# Custom UI subdirectory: pass isCustomApp / customAppPath (frontend only).
# App in a subdirectory: pass workingDirectory.
#
# Deploy and install use DIFFERENT GitHub Environments
# ({env}-deploy vs {env}-install) so they can have different reviewers
# and secrets. Pin Forgeworx/forgedeploy to a SHA or tag — not @main.
name: Deploy Forge App
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        description: 'Forge environment'
        default: development
        options:
          - development
          - staging
          - production
      product:
        required: false
        description: 'Atlassian app (jira, confluence, compass, bitbucket, jira-service-management). Required to install.'
      siteUrl:
        required: false
        description: 'Atlassian site URL (e.g., yourcompany.atlassian.net). Required to install.'
      runInstall:
        type: boolean
        required: false
        default: false
        description: 'Run the privileged install job (separate environment) after deploy?'
      allowProduction:
        type: boolean
        required: false
        default: false
        description: 'Required when Forge environment is production. Also requires a protected GitHub Environment'
      isCustomApp:
        type: boolean
        required: false
        default: false
        description: 'Existing app: build a Custom UI frontend in a subdirectory?'
      customAppPath:
        required: false
        description: 'Existing app: relative Custom UI path (required if isCustomApp is true)'
      workingDirectory:
        required: false
        description: 'Existing app: folder with manifest.yml (default: repository root)'

permissions:
  contents: read

concurrency:
  group: forge-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (engineering)
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}-deploy
    steps:
      - uses: actions/checkout@v7

      # Pin uses: Forgeworx/forgedeploy@<sha-or-tag> in real pipelines.
      - uses: Forgeworx/forgedeploy@main
        id: forge
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        with:
          phase: deploy
          environment: ${{ inputs.environment }}
          allowProduction: ${{ inputs.allowProduction }}
          isCustomApp: ${{ inputs.isCustomApp }}
          customAppPath: ${{ inputs.customAppPath }}
          workingDirectory: ${{ inputs.workingDirectory }}

  install:
    name: Install (release)
    needs: deploy
    if: ${{ inputs.runInstall }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}-install
    steps:
      - uses: actions/checkout@v7

      # Prefer FORGE_INSTALL_API_TOKEN on this environment; script falls back
      # to FORGE_API_TOKEN (weaker — same principal as deploy).
      - uses: Forgeworx/forgedeploy@main
        id: forge
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_INSTALL_API_TOKEN: ${{ secrets.FORGE_INSTALL_API_TOKEN }}
        with:
          phase: install
          environment: ${{ inputs.environment }}
          allowProduction: ${{ inputs.allowProduction }}
          product: ${{ inputs.product }}
          siteUrl: ${{ inputs.siteUrl }}
          workingDirectory: ${{ inputs.workingDirectory }}
